name: api
image:
  repository: ghcr.io/davidmesamoyano/nimbus-demo-app
port: 8080
replicas: 1
size: small
talksTo: []          # api no necesita llamar a nadie
env:
  MESSAGE: "Precios actualizados desde la API"

environments:
  dev:
    image:
      tag: "local" # nimbus:dev-tag
  prod:
    replicas: 3
    image:
      tag: "local" # nimbus:prod-tag
