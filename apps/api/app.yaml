# ───────────────────────────────────────────────────────────────
#  Esto es TODO lo que un desarrollador escribe para desplegar su app.
#  La plataforma se encarga del resto (build, despliegue, red, mTLS,
#  métricas). Formato completo: platform/charts/nimbus-app/values.schema.json
