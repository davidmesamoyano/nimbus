# Panel de Grafana con las métricas de oro de cada app (tráfico, errores,
# latencia y réplicas). Grafana lo carga solo gracias a la etiqueta
# grafana_dashboard: "1".
apiVersion: v1
kind: ConfigMap
metadata:
  name: nimbus-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  nimbus-apps.json: |-
    {
      "title": "Nimbus · Apps",
      "uid": "nimbus-apps",
      "schemaVersion": 39,
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "tags": [
        "nimbus"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Datasource"
          },
          {
            "name": "app",
            "type": "query",
            "label": "App",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(nimbus_http_requests_total, app)",
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Peticiones por segundo",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (app) (rate(nimbus_http_requests_total{app=~\"$app\"}[1m]))",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Tasa de errores (5xx)",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (app) (rate(nimbus_http_requests_total{app=~\"$app\",code=~\"5..\"}[1m])) / clamp_min(sum by (app) (rate(nimbus_http_requests_total{app=~\"$app\"}[1m])), 1e-9)",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latencia p95",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (app, le) (rate(nimbus_http_request_duration_seconds_bucket{app=~\"$app\"}[5m])))",
              "legendFormat": "{{app}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Réplicas disponibles",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"apps\", deployment=~\"$app\"}",
              "legendFormat": "{{deployment}}"
            }
          ]
        }
      ]
    }
