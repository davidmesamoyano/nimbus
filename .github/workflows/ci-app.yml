# CI de la app de ejemplo:
#   test → build → escaneo de vulnerabilidades → push a GHCR → GitOps
# El último paso actualiza la etiqueta de imagen de dev en los app.yaml y
# hace commit: Argo CD detecta el cambio y despliega en nimbus-dev solo.
name: ci-app

on:
  push:
    branches: [main]
    paths: ["demo-app/**", ".github/workflows/ci-app.yml"]
  pull_request:
    paths: ["demo-app/**", ".github/workflows/ci-app.yml"]

permissions:
  contents: write    # para hacer commit del nuevo tag
  packages: write    # para publicar en GitHub Container Registry

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests unitarios
        working-directory: demo-app
        run: python -m unittest -v test_app

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular nombre y etiqueta de la imagen
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/nimbus-demo-app" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Construir imagen
        run: docker build -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" demo-app

      - name: Escanear vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"     # si hay vulnerabilidades graves, no se publica

      - name: Login en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen
        if: github.event_name == 'push'
        run: docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      - name: GitOps → actualizar la versión de dev
        if: github.event_name == 'push'
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          for f in apps/*/app.yaml; do
            # Solo las apps que usan esta imagen
            if grep -q "nimbus-demo-app" "$f"; then
              sed -i -E "s/(tag: *)[^ ]+( *# nimbus:dev-tag)/\1\"${tag}\"\2/" "$f"
            fi
          done
          if git diff --quiet; then
            echo "Nada que actualizar"
            exit 0
          fi
          git config user.name "nimbus-bot"
          git config user.email "nimbus-bot@users.noreply.github.com"
          git commit -am "deploy(dev): nimbus-demo-app ${tag}"
          git push
